name: spendsense
description: A smart expense tracker

version: 2.0.0+20

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  http: ^1.1.0
  flutter_sms_inbox: ^1.0.3
  fl_chart: ^0.66.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  permission_handler: ^11.3.0

  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  shared_preferences: ^2.2.3
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^18.0.0
  image_picker: ^1.1.2
  reactive_forms: ^17.0.0

  # 🔑 API key management
  flutter_secure_storage: ^9.0.0

  # 🔉 UI sound effects.
  # Added deliberately: Flutter has no built-in way to play a bundled asset, and
  # the brief requires distinct, locally bundled cues (a system "click" cannot
  # express a transaction-success signature). This is the de-facto standard
  # plugin for short, low-latency effects, is MIT-licensed, declares no Android
  # permissions, and needs no Gradle/AGP/Kotlin changes (minSdk 19 / compileSdk
  # 36, both satisfied by the app's Flutter defaults of 24 / 36).
  audioplayers: ^6.8.1

flutter:
  uses-material-design: true

  assets:
    - shorebird.yaml    # Shorebird code-push config; contains no secrets.
    # Original, procedurally generated UI cues. Provenance: assets/sounds/CREDITS.md
    - assets/sounds/

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  # Adaptive (API 26+) icon: gradient background drawable + glyph-only
  # foreground kept inside the 66% safe zone so any launcher mask is safe.
  adaptive_icon_background: "@drawable/ic_launcher_background"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true
