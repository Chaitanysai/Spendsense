name: spendsense
description: A smart expense tracker

version: 2.0.0+20

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  http: ^1.1.0
  flutter_sms_inbox: ^1.0.3
  fl_chart: ^0.66.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  permission_handler: ^11.3.0

  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  shared_preferences: ^2.2.3
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^18.0.0
  image_picker: ^1.1.2
  reactive_forms: ^17.0.0

  # 🔑 API key management
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0

flutter:
  uses-material-design: true

  assets:
    - shorebird.yaml
    - .env          # loaded at runtime for dev; excluded from release via .gitignore

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21
