name: OTA Publish

# Publishes a release APK to Firebase Hosting plus its manifest, so installed
# builds can self-update. This is the ONLY workflow that writes to production
# hosting, and it never runs automatically on a pull request.
#
# Two separate jobs:
#   validate - builds nothing, deploys nothing. Generates the manifest from an
#              existing artifact and proves the manifest contains the pinned
#              certificate fingerprint.
#   deploy   - runs only when explicitly dispatched with confirm=deploy, and
#              only after validate succeeds.
#
# Firebase credentials are read from the FIREBASE_TOKEN secret only. Absent
# credentials fail the deploy job with an actionable message; the workflow never
# invents an endpoint or a token.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish to Firebase Hosting. Anything else validates only.'
        required: true
        default: 'validate'
        type: string
      notes:
        description: 'Release notes (one line).'
        required: false
        default: ''
        type: string
      minimum_version:
        description: 'REQUIRED. Oldest version still supported, x.y.z. Never defaults to this build.'
        required: true
        type: string
      channel:
        description: 'staging publishes to /staging/ and never reaches the production manifest. production is the default.'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build manifest and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Signing secrets are only available to protected refs. The release
    # environment adds the repository's protected-branch policy; the explicit
    # guard keeps the intent readable and fails closed if that policy changes.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    environment: release
    permissions:
      contents: read
    outputs:
      deploy_intent: ${{ steps.intent.outputs.deploy_intent }}
      version: ${{ steps.version.outputs.version }}
      # "" for production, "staging" for the staging channel. The deploy job
      # needs it to find the payload and to say truthfully what it published.
      subdir: ${{ steps.channel.outputs.subdir }}
      # No APK path output on purpose. GitHub drops a job output whose value
      # matches a registered secret, and any secret whose value occurs inside
      # the APK filename empties it silently. The uploaded payload is the
      # handoff; deploy re-checks that payload rather than trusting an output.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Resolved once, here, because three later steps have to agree on it
      # exactly: the compiled-in OTA_MANIFEST_URL, the manifest's downloadUrl
      # (--base-url) and the directory the payload is staged into. If any one of
      # them computed the subdirectory itself they could disagree, and a
      # client whose compiled URL points at one channel while the manifest it
      # reads names the other is the one failure this whole job exists to
      # prevent.
      - name: Resolve the publication path
        id: channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            production) SUBDIR="" ;;
            staging)    SUBDIR="staging" ;;
            *) echo "Unknown channel: $CHANNEL" >&2; exit 1 ;;
          esac
          echo "subdir=$SUBDIR" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL (publishing under /${SUBDIR:-<root>})"

      - name: Decide intent
        id: intent
        env:
          # Pass the dispatch input through the environment, never interpolate
          # it directly into a shell script.
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" = "deploy" ]; then
            echo "deploy_intent=true" >> "$GITHUB_OUTPUT"
            echo "Intent: DEPLOY (will publish to Firebase Hosting)"
          else
            echo "deploy_intent=false" >> "$GITHUB_OUTPUT"
            echo "Intent: VALIDATE ONLY"
          fi

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup
        with:
          channel: 'stable'
          flutter-version: '3.47.8'

      - name: Get dependencies
        run: flutter pub get

      - name: Write Firebase Android config
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES }}
        run: dart run tool/write_google_services.dart

      - name: Require OTA host configuration
        # No invented endpoint: the published origin must be stated explicitly.
        env:
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
        run: |
          if [ -z "${OTA_BASE_URL:-}" ]; then
            echo "::error::Repository variable OTA_BASE_URL is not set."
            echo "Set it to the Firebase Hosting origin that serves ota/public, e.g. https://spendsense-ota-2026.web.app" >&2
            exit 1
          fi
          echo "OTA host: $OTA_BASE_URL"

      - name: Require release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$SIGNING_KEY" ]    && MISSING="$MISSING SIGNING_KEY"
          [ -z "$KEY_ALIAS" ]      && MISSING="$MISSING KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]   && MISSING="$MISSING KEY_PASSWORD"
          [ -z "$STORE_PASSWORD" ] && MISSING="$MISSING STORE_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Release signing is not configured; missing:$MISSING"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/upload-keystore.jks

      - name: Assert the OTA certificate pin matches the release keystore
        id: pin
        # The pin lives in lib/config/update_config.dart and is the only thing
        # standing between a manifest and an installer. A keystore rotation
        # would otherwise silently orphan every installed build, so fail here.
        #
        # Extraction uses tool/read_ota_pin.dart rather than shell matching: the
        # constant is declared across two lines and its name also appears as a
        # usage reference, which made a one-line sed return an empty string and
        # report a false mismatch. The tool fails closed on missing, malformed
        # or ambiguous declarations.
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          KEYSTORE=android/app/upload-keystore.jks
          FP=$(keytool -list -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
                 -storepass "$STORE_PASSWORD" 2>/dev/null \
               | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$FP" ]; then
            echo "::error::Could not read the certificate fingerprint from the keystore"
            exit 1
          fi

          if ! PINNED=$(dart run tool/read_ota_pin.dart --file lib/config/update_config.dart); then
            echo "::error::Could not read the pinned OTA certificate from lib/config/update_config.dart"
            exit 1
          fi

          echo "keystore SHA-256 : $FP"
          echo "pinned in code   : $PINNED"
          if [ -z "$PINNED" ] || [ "$FP" != "$PINNED" ]; then
            echo "::error::OTA certificate pin does not match the release keystore; installed builds could never apply an update"
            exit 1
          fi
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "OK: OTA pin matches the release signing certificate"

      - name: Build signed release APK
        # OTA_MANIFEST_URL is compile-time: without it UpdateConfig reports
        # "not configured" and the shipped APK can never check for updates.
        # Passing it here is what makes a published build OTA-capable.
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
          GMAIL_SERVER_CLIENT_ID: ${{ vars.GMAIL_SERVER_CLIENT_ID }}
          SUBDIR: ${{ steps.channel.outputs.subdir }}
        run: |
          if [ -z "${OTA_BASE_URL:-}" ]; then
            echo "::error::OTA_BASE_URL repository variable is not set"
            exit 1
          fi
          # The channel subdirectory has to be in the COMPILED url, because an
          # installed build reads exactly this URL and nothing else. A staging
          # build that pointed at the production manifest would offer
          # production releases to testers.
          OTA_ROOT="${OTA_BASE_URL%/}${SUBDIR:+/$SUBDIR}"
          echo "Compiled OTA manifest URL: $OTA_ROOT/manifest.json"
          # Gmail OAuth is optional: an empty client ID leaves email import
          # disabled at runtime rather than failing the release.
          DEFINES=()
          if [ -n "${GMAIL_SERVER_CLIENT_ID:-}" ]; then
            DEFINES+=(--dart-define=GMAIL_SERVER_CLIENT_ID="$GMAIL_SERVER_CLIENT_ID")
          fi
          # Unquoted expansion is deliberate: with an empty array this passes
          # no extra argument (a quoted "${DEFINES[@]}" would pass one empty).
          flutter build apk --release \
            --dart-define=OTA_MANIFEST_URL="$OTA_ROOT/manifest.json" \
            ${DEFINES[@]+"${DEFINES[@]}"}

      - name: Verify the built APK is signed with the pinned certificate
        # Checking the keystore proves the pin matches the key we hold. It says
        # nothing about the APK that was actually produced: android/app/
        # build.gradle.kts falls back to the debug signing config when no
        # signing environment is visible, and generate_ota_manifest.dart writes
        # signingCertSha256 from the pin rather than from the artifact. So
        # without this step a debug-signed APK would ship under a manifest that
        # claims the release certificate, and no installed build could verify
        # or install it.
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::Release APK not found at $APK"
            exit 1
          fi

          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"
            exit 1
          fi

          # Capture to a file: apksigner's output stream varies with the JDK.
          if ! "$APKSIGNER" verify --print-certs "$APK" > apk-certs.txt 2>&1; then
            cat apk-certs.txt
            echo "::error::apksigner rejected the release APK"
            exit 1
          fi
          cat apk-certs.txt
          # apksigner labels the line "Signer #1 certificate SHA-256 digest:" on
          # some build-tools and "V2 Signer: certificate SHA-256 digest:" on
          # others, so anchor on the label rather than the prefix. sort -u
          # collapses repeated signers; two different digests leave two lines,
          # which fails the equality check below instead of silently using one.
          SIGNER=$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' apk-certs.txt \
                     | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)
          PINNED="${{ steps.pin.outputs.pinned }}"

          echo "APK signer : $SIGNER"
          echo "pinned     : $PINNED"
          if [ -z "$SIGNER" ] || [ "$SIGNER" != "$PINNED" ]; then
            echo "::error::The built APK is not signed by the pinned release certificate; refusing to publish it"
            exit 1
          fi
          echo "OK: the built APK is signed by the pinned release certificate"

      - name: Validate the hosting cache policy
        # Last gate before publish: the payload assertions above prove the files
        # exist, this proves browsers are allowed to keep the right ones. A rule
        # that caches HTML for an hour next to immutable hashed bundles is
        # exactly the stale-reference failure this release is meant to prevent.
        run: node tool/validate_hosting_headers.js

      - name: Assert the static site pages are present in the payload
        # `firebase deploy` replaces the WHOLE Hosting release, so the published
        # site is exactly what is in ota/public. When the landing and legal pages
        # were untracked, CI checked out only their .gitkeep placeholders and the
        # deploy silently deleted the live manifest.json — breaking the update
        # check for every installed build. Fail here instead of shipping a site
        # that replaces a working one.
        run: |
          set -euo pipefail
          missing=0
          for f in index.html 404.html landing.css \
                   legal/index.html legal/style.css legal/fonts/fonts.css; do
            if [ ! -s "ota/public/$f" ]; then
              echo "::error::ota/public/$f is missing or empty; deploying would drop it from the live site"
              missing=1
            fi
          done
          # The landing page is a built React app: index.html references hashed
          # bundles under site/assets/. Those are build output, so CI must check
          # they are present in the payload — otherwise a release deploys a shell
          # whose JS and CSS 404, and the catch-all rewrite hides it behind an
          # HTTP 200. Verify every referenced asset, not just the directory.
          if [ ! -s "ota/public/index.html" ]; then
            echo "::error::ota/public/index.html is missing"
            missing=1
          else
            refs=$(grep -oE '(src|href)="/site/assets/[^"]+"' ota/public/index.html \
                   | sed -E 's/.*="\/(.*)"/\1/' | sort -u)
            if [ -z "$refs" ]; then
              echo "::error::ota/public/index.html references no /site/assets/ bundles"
              missing=1
            fi
            for rel in $refs; do
              if [ ! -s "ota/public/$rel" ]; then
                echo "::error::ota/public/$rel is referenced by index.html but missing from the payload"
                missing=1
              fi
            done
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "OK: landing shell, its bundles, and the legal pages are in the payload"

      - name: Assert the download button and its redirect are wired
        # The button points at /releases/latest.apk, which is a Hosting rewrite to
        # the downloadApk function rather than an uploaded file. If any one of the
        # link, the rewrite or the function's source is missing, the button 404s.
        run: |
          set -euo pipefail
          # Check the path, not the attribute syntax. React minifies the button
          # to href:"/releases/latest.apk" inside the bundle, so grepping for
          # href="/releases/latest.apk" there can never match and would block
          # every deploy. The index.html check below is real HTML and keeps the
          # attribute form.
          if ! grep -q '/releases/latest\.apk' ota/public/site/assets/*.js; then
            echo "::error::the built landing bundles do not link to /releases/latest.apk (did site/ change without a rebuild?)"
            exit 1
          fi
          if ! grep -q 'href="/releases/latest.apk"' ota/public/index.html; then
            echo "::error::ota/public/index.html (noscript fallback) no longer links to /releases/latest.apk"
            exit 1
          fi
          if ! grep -q '"/releases/latest.apk"' firebase.json \
             || ! grep -q '"functionId": *"downloadApk"' firebase.json; then
            echo "::error::firebase.json has no rewrite from /releases/latest.apk to downloadApk"
            exit 1
          fi
          if [ ! -s backend/download_redirect/index.js ]; then
            echo "::error::backend/download_redirect/index.js is missing or empty"
            exit 1
          fi
          echo "OK: download button, host rewrite and downloadApk function are all in place"

      - name: Stage APK under the channel's releases directory
        id: version
        # The channel decides where the payload lands. Production keeps the
        # historic ota/public/releases path exactly; staging nests one level
        # inside it so a staged APK can never be reached from a production
        # manifest, and the two channels' file names cannot collide even when
        # they describe the same version+build (which is how a staging build is
        # promoted: by rebuilding, not by renaming).
        env:
          SUBDIR: ${{ steps.channel.outputs.subdir }}
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          NAME="${VERSION%%+*}"; BUILD="${VERSION##*+}"
          if [ -z "$NAME" ] || [ -z "$BUILD" ] || [ "$NAME" = "$VERSION" ]; then
            echo "::error::pubspec version '$VERSION' is not name+build"
            exit 1
          fi
          REL_DIR="ota/public${SUBDIR:+/$SUBDIR}/releases"
          mkdir -p "$REL_DIR"
          APK="$REL_DIR/spendsense-${NAME}+${BUILD}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "manifest_path=ota/public${SUBDIR:+/$SUBDIR}/manifest.json" >> "$GITHUB_OUTPUT"
          echo "Staged $APK"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate manifest
        id: manifest
        env:
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
          RELEASE_NOTES: ${{ inputs.notes }}
          MINIMUM: ${{ inputs.minimum_version }}
          SUBDIR: ${{ steps.channel.outputs.subdir }}
          MANIFEST_PATH: ${{ steps.version.outputs.manifest_path }}
        run: |
          # Normalise once, the same way the build step does, so the manifest's
          # downloadUrl and the compiled OTA_MANIFEST_URL cannot disagree. The
          # downloadUrl must carry the channel subdirectory, because the client
          # downloads exactly the URL the manifest names.
          BASE="${OTA_BASE_URL%/}${SUBDIR:+/$SUBDIR}"
          # --apk is required: the generator hashes the staged APK to produce the
          # manifest's sha256. Omitting it failed the run with exit 64.
          APK="${{ steps.version.outputs.apk_path }}"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::Staged APK not found at '$APK'"
            exit 1
          fi
          set -- --apk "$APK" --base-url "$BASE" --out "$MANIFEST_PATH"
          if [ -n "$RELEASE_NOTES" ]; then set -- "$@" --notes "$RELEASE_NOTES"; fi
          # --minimum is unconditional and required. It is deliberately NOT
          # defaulted to the version being published: that default set
          # minimumSupportedVersion equal to latestVersion, force-blocking every
          # older install with no rollback path.
          if [ -z "$MINIMUM" ]; then
            echo "::error::minimum_version is required. Supply the oldest version still supported."
            exit 1
          fi
          set -- "$@" --minimum "$MINIMUM"
          dart run tool/generate_ota_manifest.dart "$@"
          echo "--- manifest (sha256 redacted) ---"
          sed -e 's/\("sha256": *"\)[^"]*/\1<redacted>/' "$MANIFEST_PATH"
          echo "manifest_url=$BASE/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Verify manifest integrity locally
        env:
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
          SUBDIR: ${{ steps.channel.outputs.subdir }}
          MANIFEST_PATH: ${{ steps.version.outputs.manifest_path }}
        run: |
          BASE="${OTA_BASE_URL%/}${SUBDIR:+/$SUBDIR}"
          HOST=$(printf '%s' "$BASE" | sed -E 's#https?://([^/]+).*#\1#')
          # The exact APK this run staged. Globbing the directory would depend on
          # whatever else is present and could verify a different artifact than
          # the one the manifest was generated from.
          APK="${{ steps.version.outputs.apk_path }}"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::No staged APK at '$APK'"
            exit 1
          fi
          echo "Checking $APK against $MANIFEST_PATH"
          dart run tool/validate_ota_manifest.dart \
            --manifest "$MANIFEST_PATH" \
            --apk "$APK" \
            --expect-host "$HOST"

      - name: Pre-flight the version against the live manifest
        # The update decision is made on the client: UpdatePolicy asks
        # `latest.isNewerThan(installed)`, i.e. compareTo(...) > 0. Nothing on
        # the server compares a candidate against what is live, and
        # validate_ota_manifest.dart is deliberately offline, so a candidate
        # that does not sort strictly above the live one passes every other
        # gate, publishes cleanly, and is then never offered to anybody.
        #
        # This runs the comparison in Dart against lib/models/update_manifest
        # rather than in shell. An earlier attempt used `sort -V` plus an
        # integer test on the build number; `sort -V` and AppVersion disagree
        # on pre-release ordering, and the build-number test misfires on a
        # rebuild of the *same* version name — precisely the case a rebuild
        # creates. The tool is the app's own algorithm, pinned to the model by
        # test/ota_monotonicity_test.dart.
        env:
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
          SUBDIR: ${{ steps.channel.outputs.subdir }}
          MANIFEST_PATH: ${{ steps.version.outputs.manifest_path }}
        run: |
          # Compare against the channel being published to, not against
          # production: a staging build is allowed to be older than production
          # (that is often the point) but must still advance staging.
          LIVE="${OTA_BASE_URL%/}${SUBDIR:+/$SUBDIR}/manifest.json"
          dart run tool/check_ota_monotonicity.dart \
            --candidate "$MANIFEST_PATH" \
            --live-url "$LIVE"

      - name: Assert the production manifest was not touched by a staging run
        # firebase deploy replaces the whole Hosting release, so a staging
        # publish also republishes production. That is only safe if production's
        # bytes are identical to what is live — and the one way this job could
        # change them is by writing a manifest at the production path. It does
        # not: the manifest path is derived from the channel. This asserts the
        # derivation rather than trusting it, because the failure is silent —
        # testers would start being offered production releases.
        env:
          SUBDIR: ${{ steps.channel.outputs.subdir }}
          MANIFEST_PATH: ${{ steps.version.outputs.manifest_path }}
        run: |
          EXPECTED="ota/public${SUBDIR:+/$SUBDIR}/manifest.json"
          if [ "$MANIFEST_PATH" != "$EXPECTED" ]; then
            echo "::error::channel '$SUBDIR' wrote its manifest to '$MANIFEST_PATH', expected '$EXPECTED'"
            exit 1
          fi
          if [ -n "$SUBDIR" ] && [ -f ota/public/manifest.json ]; then
            echo "::error::a staging run produced ota/public/manifest.json; staging must never own the production manifest"
            exit 1
          fi
          echo "OK: $SUBDIR run wrote $MANIFEST_PATH and left the production manifest alone"

      - name: Upload the validated OTA payload
        # The deploy job runs on a fresh checkout, where ota/public holds only
        # its .gitkeep placeholders. Without this handoff the deploy would
        # publish an empty site and delete the live manifest and APKs; with it,
        # hosting receives exactly the bytes validated above.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ota-payload
          path: ota/public
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### OTA ${{ steps.intent.outputs.deploy_intent == 'true' && 'DEPLOY' || 'VALIDATE ONLY' }}"
            echo "- channel: ${{ inputs.channel }}"
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- sha256: \`${{ steps.version.outputs.sha256 }}\`"
            echo "- pin: matched release keystore"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish to Firebase Hosting
    needs: validate
    if: needs.validate.outputs.deploy_intent == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the validated OTA payload
        # firebase deploy replaces the whole hosting release, so the payload
        # must come from the validate job rather than from this checkout: a
        # checkout has no APK and no manifest, and deploying it would remove
        # every live file.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ota-payload
          path: ota/public

      - name: Assert the payload is the one that will be published
        env:
          SUBDIR: ${{ needs.validate.outputs.subdir }}
        run: |
          set -euo pipefail
          # The payload was staged under the channel the validate job resolved,
          # so this job checks the same subdirectory rather than assuming the
          # production layout. A staging run that landed under releases/ would
          # mean the resolution never reached the staging step.
          DIR="ota/public${SUBDIR:+/$SUBDIR}"
          if [ ! -s "$DIR/manifest.json" ]; then
            echo "::error::No validated manifest.json at $DIR/manifest.json; refusing to publish an empty site"
            exit 1
          fi
          shopt -s nullglob
          apks=("$DIR"/releases/*.apk)
          shopt -u nullglob
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected exactly one APK in $DIR/releases, found ${#apks[@]}; refusing to publish"
            exit 1
          fi
          APK="${apks[0]}"
          APK_NAME="${APK##*/}"
          # The manifest must describe this exact file, and its digest must be
          # this file's digest. Anything else means the payload is a mix of
          # runs, and publishing it would advertise an APK the site lacks.
          if ! grep -qF "releases/$APK_NAME" "$DIR/manifest.json"; then
            echo "::error::manifest.json does not reference releases/$APK_NAME; refusing to publish"
            exit 1
          fi
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          if ! grep -qF "$SHA" "$DIR/manifest.json"; then
            echo "::error::manifest.json does not carry the sha256 of releases/$APK_NAME; refusing to publish"
            exit 1
          fi
          echo "Publishing $DIR/manifest.json + $DIR/releases/$APK_NAME (sha256 $SHA)"

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: '22'

      - name: Install the download redirect function's dependencies
        # The function ships its own package.json; without the install the
        # Functions deploy aborts, so fail here with a readable message.
        working-directory: backend/download_redirect
        run: npm install --omit=dev --no-audit --no-fund

      - name: Require Firebase credentials
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::No Firebase deploy credential."
            echo "Add a FIREBASE_TOKEN secret (firebase login:ci) scoped to the" >&2
            echo "spendsense-ota-2026 project, or a GOOGLE_APPLICATION_CREDENTIALS" >&2
            echo "service account with Firebase Hosting Admin." >&2
            exit 1
          fi

      - name: Deploy hosting and the download redirect
        # `--only hosting` would publish the page while leaving the rewrite's
        # function absent, so the download button would land on the 404 page.
        # Nothing else is included: this workflow never touches the app's other
        # functions or any other Firebase service.
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # The codebase qualifier is required: with two codebases declared in
          # firebase.json, "--only functions:downloadApk" matches nothing and the
          # deploy aborts with "No function matches given --only filters".
          npx --yes firebase-tools@13.35.1 deploy \
            --only hosting,functions:download:downloadApk \
            --project spendsense-ota-2026 \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Verify the live download link serves an APK
        # The site is public and the check is one request, so prove the button
        # works instead of assuming the deploy took. Retries cover the window
        # where Hosting has the rewrite but the function is still rolling out.
        run: |
          set -euo pipefail
          URL="https://spendsense-ota-2026.web.app/releases/latest.apk"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I \
                     --max-time 20 --proto '=https' "$URL" || echo "000")
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "302" ] || [ "$CODE" = "200" ]; then
              echo "OK: $URL resolves to the published APK"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$URL did not serve an APK after deploy (last HTTP $CODE)"
          exit 1

      - name: Record what was published
        env:
          SUBDIR: ${{ needs.validate.outputs.subdir }}
        run: |
          {
            echo "### Published to Firebase Hosting"
            echo "- project: \`spendsense-ota-2026\`"
            echo "- version: \`${{ needs.validate.outputs.version }}\`"
            echo "- channel: ${SUBDIR:-production} (\`hosting\` + \`functions:downloadApk\`)"
            echo "- download: https://spendsense-ota-2026.web.app/releases/latest.apk"
          } >> "$GITHUB_STEP_SUMMARY"
