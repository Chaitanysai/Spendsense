name: Release Branch CI

# CI for the branch that actually ships.
#
# `pr-build.yml` and `pr-security.yml` only run on pull requests targeting
# `main`, and `android-release.yml` only listens for pushes to `main`. That left
# `release/*` with no CI at all: a merge into the release branch could land with
# no analysis, no tests and no security scan, and a pull request that becomes
# CONFLICTING silently stops reporting its required checks because GitHub never
# creates a merge ref to test. This workflow closes that gap by running the same
# gates on every push to a release branch and on demand.
#
# Job names are deliberately `security` and `build` so those contexts exist on
# release-branch pushes too; branch protection on `main` matches check names,
# not workflow ids.
on:
  push:
    branches:
      - 'release/**'
  # Also run on pull requests targeting a release branch. Without this the
  # required `security`/`build`/`ci-guard` contexts could only ever be reported
  # after a merge, so the first PR that introduces them could never satisfy its
  # own branch protection (a bootstrap deadlock).
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check that never runs is worse than a failing one: the gate looks
  # green because nothing reported. This job asserts the workflow actually ran
  # against the commit under test and that the toolchain files exist, so a
  # misconfigured trigger fails loudly instead of passing by silence.
  guard:
    name: ci-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assert the expected gates are present
        run: |
          set -euo pipefail
          missing=0
          for f in \
            .github/workflows/release-branch-ci.yml \
            .github/workflows/android-release.yml \
            .github/workflows/ota-publish.yml \
            pubspec.yaml \
            pubspec.lock
          do
            if [ ! -f "$f" ]; then
              echo "::error::expected build input is missing: $f"
              missing=1
            fi
          done
          if [ ! -d test ] || [ -z "$(ls -A test 2>/dev/null)" ]; then
            echo "::error::test/ is missing or empty, so 'flutter test' would pass vacuously"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          {
            echo "### Release branch CI"
            echo '```'
            echo "event:      ${GITHUB_SHA}"
            echo "git HEAD:   $(git rev-parse HEAD)"
            echo "ref:        ${GITHUB_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: security
    runs-on: ubuntu-24.04
    needs: guard
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --upgrade 'semgrep==1.181.0'

      - name: Semgrep - secrets
        shell: bash
        run: |
          set -o pipefail
          semgrep \
            --config p/secrets \
            --metrics=off \
            --error \
            --jobs 1 \
            --json \
            --output semgrep-secrets.json \
            lib android .github 2>&1 | tee semgrep-secrets.log

      - name: Verify the scan actually covered the source tree
        # Passing with zero analysed paths proves nothing. Assert that Semgrep
        # evaluated a non-trivial number of files and that every workflow was
        # included.
        run: |
          node -e '
            const fs = require("fs");
            let report;
            try {
              report = JSON.parse(fs.readFileSync("semgrep-secrets.json", "utf8"));
            } catch (e) {
              console.error(`semgrep-secrets.json is missing or unparseable (${e.message}); the scan did not produce a result`);
              process.exit(1);
            }
            if (!report.paths || !Array.isArray(report.paths.scanned)) {
              console.error("semgrep report has no paths.scanned array; refusing to claim coverage");
              process.exit(1);
            }
            const paths = new Set(report.paths.scanned.map((p) => p.replace(/^\.\//, "")));
            if (paths.size < 20) {
              console.error(`only ${paths.size} files were scanned; expected the full tree`);
              process.exit(1);
            }
            const workflows = fs.readdirSync(".github/workflows").filter((f) => /\.ya?ml$/.test(f));
            const missing = workflows.filter((f) => !paths.has(`.github/workflows/${f}`));
            if (missing.length > 0) {
              console.error("workflow files not scanned: " + missing.join(", "));
              process.exit(1);
            }
            console.log(`scanned ${paths.size} files including ${workflows.length} workflows`);
          '

      - name: Semgrep - security audit
        shell: bash
        run: |
          set -o pipefail
          semgrep \
            --config p/security-audit \
            --metrics=off \
            --error \
            --jobs 1 \
            lib android .github 2>&1 | tee semgrep-audit.log

  build:
    name: build
    runs-on: ubuntu-24.04
    needs: guard
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup
        with:
          channel: 'stable'
          flutter-version: '3.47.8'

      - name: Get dependencies
        run: flutter pub get

      - name: Verify pubspec.lock was not rewritten
        run: git diff --exit-code -- pubspec.lock

      - name: Validate every YAML file
        run: |
          npm install --no-save --no-audit --no-fund yaml
          node tool/validate_yaml.js

      - name: Static analysis
        run: flutter analyze

      - name: Run the full test suite
        # Fail if the suite reports success without executing tests: a filtered
        # or empty run is the other way a build gate goes green while testing
        # nothing.
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-output.log
          executed=$(grep -oE '^[0-9]{2}:[0-9]{2} \+[0-9]+' test-output.log | tail -1 | grep -oE '\+[0-9]+' | tr -d '+')
          if [ -z "${executed:-}" ] || [ "${executed:-0}" -lt 100 ]; then
            echo "::error::flutter test reported ${executed:-0} passing tests; expected the full suite"
            exit 1
          fi
          echo "Executed ${executed} tests"
