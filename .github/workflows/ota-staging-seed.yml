name: OTA Staging Seed (build only)

# Signed historical seed for staging OTA device testing. This job is
# technically incapable of deploying: no Firebase token, no hosting/publish
# command, no manifest write, no downstream workflow dispatch. Permissions are
# contents: read only.

on:
  workflow_dispatch:
    inputs:
      seed_version:
        description: 'Exact seed version+build (must be 2.0.25+50)'
        required: true
        default: '2.0.25+50'
        type: string
      seed_ref:
        description: 'Exact seed commit SHA (must be ccd1618de70942d109cd9ce82b6fcb185de3b2da)'
        required: true
        default: 'ccd1618de70942d109cd9ce82b6fcb185de3b2da'
        type: string
      manifest_url:
        description: 'Manifest URL compiled into the seed (must be the staging URL)'
        required: true
        default: 'https://spendsense-ota-2026.web.app/staging/manifest.json'
        type: string
      confirm:
        description: 'Type BUILD-SEED to authorize a signed build'
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ota-staging-seed
  cancel-in-progress: false

jobs:
  build-seed:
    name: Build signed staging seed (build-only, no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - name: Validate dispatch inputs and version safety
        env:
          SEED_VERSION: ${{ inputs.seed_version }}
          SEED_REF: ${{ inputs.seed_ref }}
          MANIFEST_URL: ${{ inputs.manifest_url }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = 'BUILD-SEED' ] || { echo "::error::confirm must be exactly BUILD-SEED"; exit 1; }
          [ "$SEED_VERSION" = '2.0.25+50' ] || { echo "::error::unsupported seed_version"; exit 1; }
          [ "$SEED_REF" = 'ccd1618de70942d109cd9ce82b6fcb185de3b2da' ] || { echo "::error::unsupported seed_ref"; exit 1; }
          [ "$MANIFEST_URL" = 'https://spendsense-ota-2026.web.app/staging/manifest.json' ] || { echo "::error::manifest_url must be the staging URL"; exit 1; }
          SEED_NAME=${SEED_VERSION%%+*}; SEED_BUILD=${SEED_VERSION##*+}
          TARGET_NAME=2.0.26; TARGET_BUILD=51
          [ "$(printf '%s\n%s\n' "$SEED_NAME" "$TARGET_NAME" | sort -V | tail -n1)" = "$TARGET_NAME" ] || { echo "::error::seed version is not older than target"; exit 1; }
          [ "$SEED_BUILD" -lt "$TARGET_BUILD" ] || { echo "::error::seed build must be < 51"; exit 1; }
          [ "$(printf '%s\n%s\n' '2.0.24' "$SEED_NAME" | sort -V | head -n1)" = '2.0.24' ] || { echo "::error::seed below minimumSupportedVersion"; exit 1; }
          echo "Inputs validated: seed=$SEED_VERSION ref=$SEED_REF"

      - name: Checkout the seed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ccd1618de70942d109cd9ce82b6fcb185de3b2da  # tag v2.0.25+50
          persist-credentials: false

      - name: Assert checked-out source version
        env:
          SEED_VERSION: ${{ inputs.seed_version }}
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '[:space:]')
          [ "$SOURCE_VERSION" = "$SEED_VERSION" ] || { echo "::error::pubspec version $SOURCE_VERSION != $SEED_VERSION"; exit 1; }
          echo "Source version: $SOURCE_VERSION"

      - name: Cross-check live staging manifest (read-only)
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          EXPECTED_PIN: '42c8f8765597ae0fd7c430346d1778d6f13557349577321cc8a1e798cb20d367'
          SEED_VERSION: ${{ inputs.seed_version }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 --proto '=https' "$MANIFEST_URL" -o /tmp/staging-manifest.json
          jq -e '.schemaVersion == 1' /tmp/staging-manifest.json > /dev/null
          jq -e '.appId == "com.example.spendsense"' /tmp/staging-manifest.json > /dev/null
          jq -e '.latestVersion == "2.0.26" and .latestBuildNumber == 51' /tmp/staging-manifest.json > /dev/null
          jq -e --arg pin "$EXPECTED_PIN" '.signingCertSha256 | ascii_downcase == $pin' /tmp/staging-manifest.json > /dev/null
          SEED_NAME=${SEED_VERSION%%+*}
          MIN=$(jq -r '.minimumSupportedVersion' /tmp/staging-manifest.json)
          [ "$(printf '%s\n%s\n' "$MIN" "$SEED_NAME" | sort -V | head -n1)" = "$MIN" ] || { echo "::error::seed is below live minimum"; exit 1; }
          echo "Live staging manifest is schema v1, pinned, and compatible with this seed"

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.47.8 (repository action)
        uses: ./.github/actions/flutter-setup
        with:
          channel: 'stable'
          flutter-version: '3.47.8'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Write Firebase Android configuration
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES }}
        run: dart run tool/write_google_services.dart

      - name: Configure release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "$SIGNING_KEY" ] && MISSING="$MISSING SIGNING_KEY"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING KEY_PASSWORD"
          [ -z "$STORE_PASSWORD" ] && MISSING="$MISSING STORE_PASSWORD"
          [ -n "$MISSING" ] && { echo "::error::missing signing secrets:$MISSING"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Verify keystore matches the pinned certificate
        id: pin
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          FP=$(keytool -list -v -keystore android/app/upload-keystore.jks -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          [ -n "$FP" ] || { echo "::error::could not read keystore fingerprint"; exit 1; }
          PINNED=$(dart run tool/read_ota_pin.dart --file lib/config/update_config.dart)
          [ -n "$PINNED" ] || { echo "::error::could not read pinned certificate"; exit 1; }
          [ "$FP" = "$PINNED" ] || { echo "::error::keystore does not match pin"; exit 1; }
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "OK: keystore matches the pinned certificate"

      - name: Build signed release APK with staging manifest URL
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=OTA_MANIFEST_URL="$MANIFEST_URL"

      - name: Verify APK signature with apksigner
        env:
          PINNED: ${{ steps.pin.outputs.pinned }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          [ -s "$APK" ] || { echo "::error::release APK not found"; exit 1; }
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -n1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          [ -x "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" > apk-certs.txt 2>&1 || { cat apk-certs.txt; echo "::error::apksigner verification failed"; exit 1; }
          cat apk-certs.txt
          SIGNER=$(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' apk-certs.txt | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)
          [ -n "$SIGNER" ] || { echo "::error::no signer digest found"; exit 1; }
          [ "$SIGNER" = "$PINNED" ] || { echo "::error::APK signer does not match pin"; exit 1; }
          echo "OK: APK is signed by the pinned release certificate"

      - name: Verify package ID, version/build and embedded OTA URL
        env:
          EXPECTED_PACKAGE: 'com.example.spendsense'
          EXPECTED_VERSION: '2.0.25'
          EXPECTED_BUILD: '50'
          MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -n1)
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          [ -x "$AAPT2" ] || { echo "::error::aapt2 not found"; exit 1; }
          PKG=$("$AAPT2" dump packagename "$APK")
          [ "$PKG" = "$EXPECTED_PACKAGE" ] || { echo "::error::unexpected package $PKG"; exit 1; }
          BADGE=$("$AAPT2" dump badging "$APK" | head -n1)
          echo "$BADGE"
          echo "$BADGE" | grep -Eq "versionName='$EXPECTED_VERSION'" || { echo "::error::wrong versionName"; exit 1; }
          echo "$BADGE" | grep -Eq "versionCode='$EXPECTED_BUILD'" || { echo "::error::wrong versionCode"; exit 1; }
          if ! unzip -p "$APK" 2>/dev/null | grep -aF "$MANIFEST_URL" > /dev/null; then
            echo "::error::compiled OTA_MANIFEST_URL not found in the APK"; exit 1
          fi
          echo "OK: package ID, version/build and embedded manifest URL verified"

      - name: Package and checksum the artifact
        id: artifact
        env:
          SEED_VERSION: ${{ inputs.seed_version }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p seed-artifact
          OUT="seed-artifact/spendsense-staging-seed-${SEED_VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee seed-artifact/SHA256SUMS
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload signed seed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spendsense-staging-seed-2.0.25+50
          path: seed-artifact
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        env:
          SHA: ${{ steps.artifact.outputs.sha256 }}
          SEED_VERSION: ${{ inputs.seed_version }}
          MANIFEST_URL: ${{ inputs.manifest_url }}
        run: |
          {
            echo "### Staging seed APK built (build-only, not deployed)"
            echo "- seed: \`$SEED_VERSION\` at \`ccd1618de70942d109cd9ce82b6fcb185de3b2da\`"
            echo "- compiled manifest: \`$MANIFEST_URL\`"
            echo "- sha256: \`$SHA\`"
            echo "- certificate: pinned release key (apksigner verified)"
            echo "- artifact retention: 7 days"
            echo "- NOT deployed: no hosting publish, no manifest change, no device install"
          } >> "$GITHUB_STEP_SUMMARY"
