name: Pull Request Security Scan

# Satisfies the required `security` context on pull requests without reusing
# android-release.yml. That workflow's `build` job can reach release-signing
# secrets and upload an APK, so it must never run against untrusted PR code.
# This scan is the same Semgrep gate (p/secrets + p/security-audit, --error)
# with no secrets, no artifacts, and read-only repository access.
#
# The job id is `security-scan` and the check name is `security`: branch
# protection matches the reported check name, not the job id.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr-security.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: security
    # Pinned rather than ubuntu-latest: the pinned Flutter toolchain below is
    # validated on this image, and a silent image migration must not change
    # what CI proves.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record checked-out commit
        run: |
          {
            echo "### Security scan commit"
            echo '```'
            echo "event:      ${GITHUB_SHA}"
            echo "git HEAD:   $(git rev-parse HEAD)"
            echo "ref:        ${GITHUB_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade 'semgrep==1.181.0'

      - name: Run Semgrep (secrets + security audit)
        # Same rules and --error as android-release.yml, so a PR cannot pass
        # this gate while the release gate would later fail on the same code.
        run: |
          semgrep \
            --config p/secrets \
            --config p/security-audit \
            --metrics=off \
            --error \
            lib android .github
