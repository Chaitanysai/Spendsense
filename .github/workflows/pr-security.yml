name: Pull Request Security Scan

# Satisfies the required `security` context on pull requests without reusing
# android-release.yml. That workflow's `build` job can reach release-signing
# secrets and upload an APK, so it must never run against untrusted PR code.
# This runs the same rules with no secrets, no artifacts, and read-only access.
#
# The job id is `security-scan` and the check name is `security`: branch
# protection matches the reported check name, not the job id.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr-security.yml'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Repository-wide, not per-job: semgrep-core was OOM-killed (exit -11)
      # scanning with default parallelism on a 4 GB runner.
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record checked-out commit
        run: |
          {
            echo "### Security scan commit"
            echo '```'
            echo "event:      ${GITHUB_SHA}"
            echo "git HEAD:   $(git rev-parse HEAD)"
            echo "ref:        ${GITHUB_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        # Same version android-release.yml pins for reproducible results.
        run: |
          python -m pip install --upgrade 'semgrep==1.181.0'

      - name: Semgrep - secrets
        # Secret detection is pure regex, so it is cheap to run separately and
        # cannot be masked by a memory failure in the analysis pass below.
        run: |
          semgrep \
            --config p/secrets \
            --metrics=off \
            --error \
            --jobs 1 \
            lib android .github

      - name: Semgrep - security audit
        # Same rule set as the release gate, bounded so the 4 GB runner cannot
        # OOM-kill semgrep-core. A crash fails the check rather than passing it.
        run: |
          semgrep \
            --config p/security-audit \
            --metrics=off \
            --error \
            --jobs 1 \
            --timeout 300 \
            lib android .github
