name: Android Release Build

on:
  # Only a protected branch may produce a signed build. Tag pushes and feature
  # branches are deliberately absent: anyone with write access could otherwise
  # make a workflow on their branch run with the release keystore.
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default: every job that needs more must opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Semgrep Security Scan
    # Pinned to 24.04: ubuntu-latest migrated to Ubuntu 26 (Oct 2026) and
    # semgrep-core segfaults there on this rule set.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Pinned release branch: '3.x' resolved to 3.15.0 (bleeding-edge).
          python-version: '3.12'

      - name: Install Semgrep
        # Pinned: 1.182.0 (shipped 2026-10-20) has an intermittent semgrep-core
        # segfault (-11); 1.181.0 (2026-10-14) is the last verified-stable release.
        run: python -m pip install --upgrade "semgrep==1.181.0"

      - name: Run Semgrep (secrets + security audit)
        # CI runners can OOM-kill semgrep-core (exit -11) on this repo's rule
        # set; cap memory (~70% of a 5 GB runner) and parallelism per the
        # Semgrep CI guidance rather than disabling the scan.
        run: |
          semgrep \
            --config p/secrets \
            --config p/security-audit \
            --metrics=off \
            --error \
            --max-memory 3500 \
            --jobs 2 \
            lib android .github

  build:
    name: Build Android APK
    # Pinned to 24.04 to match the security job and avoid the Ubuntu 26
    # runner-image migration until all tooling is verified there.
    runs-on: ubuntu-24.04
    needs: security
    # The release environment has a protected-branch policy. Keep a job-level
    # guard as well so an unprotected ref can never request the signing secrets.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Local copy of subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      # (v2). The upstream composite action declares `uses: actions/cache@v5`
      # in its own definition, which this repository's Actions policy rejects
      # during job setup (sha_pinning_required), even though the cache steps
      # never ran here. The copy drops only those two steps; see
      # .github/actions/flutter-setup/action.yaml.
      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup
        with:
          channel: 'stable'

      - name: Prepare Android SDK components
        # Deterministic provisioning: Gradle otherwise auto-invokes sdkmanager
        # mid-build, swallowing errors (intermittent exit 1). Accept licenses
        # and install the exact components required (compileSdk 36) up front.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Get Flutter dependencies
        run: flutter pub get

      # The repo tracks pubspec.lock, but developer laptops do not have Flutter
      # installed. When this commit's dependency manifest changed the resolved
      # lock, upload the refreshed lock so it can be committed back remotely.
      - name: Upload refreshed pubspec.lock when resolution changed
        if: always()
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            cp pubspec.lock /tmp/pubspec.lock.ci
          fi

      - name: Upload pubspec.lock artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec.lock
          path: /tmp/pubspec.lock.ci
          if-no-files-found: ignore

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Verify required signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          missing=0
          for var in SIGNING_KEY KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Required signing secret ${var} is missing or empty."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::All four signing secrets (SIGNING_KEY, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD) must be configured before running this workflow."
            exit 1
          fi
          echo "All required signing secrets are present."

      - name: Prepare release keystore
        id: prepare_keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::Decoded release keystore is empty or invalid."
            exit 1
          fi
          echo "Release keystore prepared."

      - name: Verify Firebase client config
        run: |
          # The google-services Gradle plugin fails cryptically when this file
          # is absent, so fail early with an actionable message instead.
          if [ ! -s android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing. It is tracked in Git; restore it before building."
            exit 1
          fi
          echo "Firebase client config present."

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
        run: |
          # The updater's manifest URL is compiled in with --dart-define, so a
          # release built without it silently ships with "Update channel not
          # configured" and can never receive another update. Compile it from
          # the same repository variable that drives manifest generation, so the
          # APK and the manifest it will read can never disagree about origin.
          # Absent the variable the build is unchanged (local/dev behaviour).
          DEFINES=""
          if [ -n "${OTA_BASE_URL:-}" ]; then
            DEFINES="--dart-define=OTA_MANIFEST_URL=${OTA_BASE_URL%/}/manifest.json"
            echo "Compiling update channel: ${OTA_BASE_URL%/}/manifest.json"
          else
            echo "::notice::OTA_BASE_URL is not set; this APK will have no update channel."
          fi
          flutter build apk --release $DEFINES

      - name: Verify and Re-label APK
        id: verify_apk
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -eq 0 ]; then
            echo "APK is empty!"
            exit 1
          fi
          echo "APK generated successfully. Size: $SIZE bytes."

          mv "$APK_PATH" "build/app/outputs/flutter-apk/spendsense-release.apk"
          echo "ARTIFACT_PATH=build/app/outputs/flutter-apk/spendsense-release.apk" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=spendsense-release.apk" >> $GITHUB_ENV
          echo "SIGNING_STATUS=release-key" >> $GITHUB_ENV

      - name: Verify APK metadata and signing certificate
        env:
          ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
        run: |
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "── APK badging ──"
          "$AAPT" dump badging "$ARTIFACT_PATH" | grep -E "^package:|^application-label:|^launchable-activity:"

          echo "── APK signature ──"
          if ! "$APKSIGNER" verify --verbose "$ARTIFACT_PATH"; then
            echo "::error::APK signature verification failed"
            exit 1
          fi
          # Capture to a file and echo it: apksigner's output stream differs
          # across host/JDK combinations, so never grep a pipe blindly here.
          "$APKSIGNER" verify --print-certs "$ARTIFACT_PATH" > apk-certs.txt 2>&1
          cat apk-certs.txt
          grep -q "certificate DN" apk-certs.txt || { echo "::error::APK signing certificate DN missing"; exit 1; }
          CERT_SHA256=$(grep -i "SHA-256 digest" apk-certs.txt | head -n 1)
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::APK signing certificate SHA-256 digest missing"
            exit 1
          fi
          echo "Signing certificate SHA-256: $CERT_SHA256"

          # Fail closed: the built APK must be signed by the pinned SpendSense
          # release certificate. This is the same fingerprint the app pins in
          # lib/config/update_config.dart, so a CI artifact can never disagree
          # with what the updater will accept.
          EXPECTED_CERT_SHA256="42c8f8765597ae0fd7c430346d1778d6f13557349577321cc8a1e798cb20d367"
          ACTUAL_CERT_SHA256=$(echo "$CERT_SHA256" | sed -E 's/.*: *//' | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match the pinned release certificate."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi
          echo "Pinned certificate match confirmed."
          echo "APK_CERT_SHA256=$ACTUAL_CERT_SHA256" >> "$GITHUB_ENV"

          echo "Signing status recorded by the build: $SIGNING_STATUS"

      # Regression gate for the "no secret material in the APK" security fix:
      # .env entries and known provider API-key patterns must be absent.
      # tool/scan_apk_secrets.py scans every ZIP entry byte-by-byte (no disk
      # extraction), exempts only the single reviewed Firebase Android client
      # key via its independently reviewed SHA-256 assertion, and prints only
      # counts and short fingerprints - secret values are never echoed.
      - name: Verify no secret material is bundled in the APK
        env:
          ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
        run: |
          python3 tool/scan_apk_secrets.py \
            "$ARTIFACT_PATH" \
            --project-root . \
            --expected-firebase-sha256 3533c01b04a7f5099cba73c2039cddbc49c39f72b657272f9068bdf932c01f1f

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      # OTA metadata is generated from the verified build, never hand-edited.
      # It is only produced when a channel origin is configured as the
      # repository variable OTA_BASE_URL; this step does not deploy anything.
      - name: Generate OTA manifest artifact
        if: ${{ vars.OTA_BASE_URL != '' }}
        env:
          OTA_BASE_URL: ${{ vars.OTA_BASE_URL }}
          ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
        run: |
          set -euo pipefail
          VERSION_LINE="$(grep -E '^version:' pubspec.yaml | head -n1)"
          VERSION_NAME="$(echo "$VERSION_LINE" | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          BUILD_NUMBER="$(echo "$VERSION_LINE" | sed -E 's/.*\+([0-9]+).*/\1/')"
          RELEASE_DIR="ota/public/releases"
          mkdir -p "$RELEASE_DIR"
          APK_TARGET="$RELEASE_DIR/spendsense-${VERSION_NAME}+${BUILD_NUMBER}.apk"
          cp "$ARTIFACT_PATH" "$APK_TARGET"
          APK_SHA256="$(sha256sum "$APK_TARGET" | awk '{print $1}')"
          echo "$APK_SHA256" > "$APK_TARGET.sha256"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          dart run tool/generate_ota_manifest.dart \
            --apk "$APK_TARGET" \
            --base-url "$OTA_BASE_URL" \
            --out ota/public/manifest.json \
            --notes "Release ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Upload OTA manifest artifact
        if: ${{ vars.OTA_BASE_URL != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ota-manifest
          path: |
            ota/public/manifest.json
            ota/public/releases/*.sha256
          if-no-files-found: error

      - name: OTA manifest not generated (channel not configured)
        if: ${{ vars.OTA_BASE_URL == '' }}
        run: |
          echo "::notice::OTA_BASE_URL is not set, so no manifest was generated. Set the repository variable and see docs/OTA_UPDATES.md. The APK artifact is still complete and unpublishable by itself."

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: |
            build/app/outputs/logs/**
            android/build/reports/**
          if-no-files-found: ignore
