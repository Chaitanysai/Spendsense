name: Android Release Build

on:
  push:
    branches:
      - feat/spendsense-sync-20261017
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default: every job that needs more must opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep (secrets + security audit)
        run: |
          semgrep \
            --config p/secrets \
            --config p/security-audit \
            --metrics=off \
            --error \
            lib android .github

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'

      # .env is declared as a Flutter asset in pubspec.yaml; an empty placeholder
      # keeps release builds reproducible without bundling any real credentials.
      - name: Create empty .env placeholder
        run: touch .env

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Prepare keystore for release signing
        id: prepare_keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > android/app/upload-keystore.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "Skipping keystore creation as SIGNING_KEY secret is not found."
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Build release APK (Secured)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Build debug-signed sideload APK (Fallback)
        if: env.HAS_KEYSTORE == 'false'
        run: flutter build apk --release # Falls back to the debug signing config when no keystore is present

      - name: Verify and Re-label APK
        id: verify_apk
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -eq 0 ]; then
            echo "APK is empty!"
            exit 1
          fi
          echo "APK generated successfully. Size: $SIZE bytes."

          if [ "$HAS_KEYSTORE" = "true" ]; then
            mv "$APK_PATH" "build/app/outputs/flutter-apk/spendsense-release.apk"
            echo "ARTIFACT_PATH=build/app/outputs/flutter-apk/spendsense-release.apk" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=spendsense-release.apk" >> $GITHUB_ENV
            echo "SIGNING_STATUS=release-key" >> $GITHUB_ENV
          else
            echo "::warning::Private signing key not provided. APK is signed with the debug key and should only be used for testing/sideloading."
            mv "$APK_PATH" "build/app/outputs/flutter-apk/spendsense-debug-signed-sideload.apk"
            echo "ARTIFACT_PATH=build/app/outputs/flutter-apk/spendsense-debug-signed-sideload.apk" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=spendsense-debug-signed-sideload.apk" >> $GITHUB_ENV
            echo "SIGNING_STATUS=debug-key" >> $GITHUB_ENV
          fi

      - name: Verify APK metadata and signing certificate
        env:
          ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
        run: |
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "── APK badging ──"
          "$AAPT" dump badging "$ARTIFACT_PATH" | grep -E "^package:|^application-label:|^launchable-activity:" || true

          echo "── APK signature ──"
          "$APKSIGNER" verify --print-certs "$ARTIFACT_PATH" | grep -E "Signer #1 (certificate DN|SHA-256)" || true

          echo "Signing status recorded by the build: $SIGNING_STATUS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: |
            build/app/outputs/logs/**
            android/build/reports/**
          if-no-files-found: ignore
