name: Android Release Build

on:
  push:
    branches:
      - feat/spendsense-sync-20261017
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default: every job that needs more must opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Pinned, not '3.x': '3.x' now resolves to 3.15.1, where semgrep-core
          # segfaults (exit -11) on this repository's sources. 3.12 is the
          # runtime the last passing release scan used.
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep (secrets + security audit)
        run: |
          semgrep \
            --config p/secrets \
            --config p/security-audit \
            --metrics=off \
            --error \
            lib android .github

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'

      - name: Prepare Android SDK components
        # Deterministic provisioning: Gradle otherwise auto-invokes sdkmanager
        # mid-build, swallowing errors (intermittent exit 1). Accept licenses
        # and install the exact components required (compileSdk 36) up front.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Write Firebase Android config
        # The fused com.google.gms.google-services plugin reads
        # android/app/google-services.json, which is gitignored. Materialise it
        # from the repository secret so no Firebase Android config is committed.
        # This fails the build when the secret is absent: a release cannot be
        # assembled without it, and silently skipping it would only defer the
        # failure to Gradle with a less useful message.
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES }}
        run: dart run tool/write_google_services.dart

      - name: Verify the generated config stays untracked
        run: |
          if git ls-files --error-unmatch android/app/google-services.json 2>/dev/null; then
            echo "::error::android/app/google-services.json is tracked; it must stay gitignored"
            exit 1
          fi
          echo "OK: android/app/google-services.json is present and untracked"

      # The repo tracks pubspec.lock, but developer laptops do not have Flutter
      # installed. When this commit's dependency manifest changed the resolved
      # lock, upload the refreshed lock so it can be committed back remotely.
      - name: Upload refreshed pubspec.lock when resolution changed
        if: always()
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            cp pubspec.lock /tmp/pubspec.lock.ci
          fi

      - name: Upload pubspec.lock artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec.lock
          path: /tmp/pubspec.lock.ci
          if-no-files-found: ignore

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Prepare keystore for release signing
        id: prepare_keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY is not configured; cannot prepare the release keystore"
            exit 1
          fi
          if ! printf '%s' "$SIGNING_KEY" | base64 --decode > android/app/upload-keystore.jks 2>/dev/null; then
            echo "::error::SIGNING_KEY is not valid base64; the keystore could not be decoded"
            exit 1
          fi
          echo "OK: decoded release keystore ($(stat -c%s android/app/upload-keystore.jks) bytes)"

      - name: Require release signing
        # A release build must never be signed with the debug key and shipped
        # as if it were a release. If the keystore or any signing credential is
        # missing, stop here with an actionable error instead of falling back.
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$SIGNING_KEY" ]     && MISSING="$MISSING SIGNING_KEY"
          [ -z "$KEY_ALIAS" ]       && MISSING="$MISSING KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]    && MISSING="$MISSING KEY_PASSWORD"
          [ -z "$STORE_PASSWORD" ]  && MISSING="$MISSING STORE_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Release signing is not configured; missing:$MISSING"
            echo "Refusing to build a release. A debug-signed APK must not be published as a release." >&2
            exit 1
          fi
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::android/app/upload-keystore.jks is missing or empty after decoding SIGNING_KEY"
            exit 1
          fi
          echo "OK: release signing credentials are present"

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Verify and Re-label APK
        id: verify_apk
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -eq 0 ]; then
            echo "APK is empty!"
            exit 1
          fi
          echo "APK generated successfully. Size: $SIZE bytes."

          # Reaching this step means the Require-release-signing gate passed, so
          # the artifact is signed with the release key by construction. There is
          # deliberately no debug-signed fallback: a release job that cannot sign
          # has already failed above.
          mv "$APK_PATH" "build/app/outputs/flutter-apk/spendsense-release.apk"
          echo "ARTIFACT_PATH=build/app/outputs/flutter-apk/spendsense-release.apk" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=spendsense-release.apk" >> $GITHUB_ENV
          echo "SIGNING_STATUS=release-key" >> $GITHUB_ENV

      - name: Verify APK metadata and signing certificate
        env:
          ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
        run: |
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "── APK badging ──"
          "$AAPT" dump badging "$ARTIFACT_PATH" | grep -E "^package:|^application-label:|^launchable-activity:"

          echo "── APK signature ──"
          if ! "$APKSIGNER" verify --verbose "$ARTIFACT_PATH"; then
            echo "::error::APK signature verification failed"
            exit 1
          fi
          # Capture to a file and echo it: apksigner's output stream differs
          # across host/JDK combinations, so never grep a pipe blindly here.
          "$APKSIGNER" verify --print-certs "$ARTIFACT_PATH" > apk-certs.txt 2>&1
          cat apk-certs.txt
          grep -q "certificate DN" apk-certs.txt || { echo "::error::APK signing certificate DN missing"; exit 1; }
          grep -q "SHA-256 digest" apk-certs.txt || { echo "::error::APK signing certificate SHA-256 digest missing"; exit 1; }

          echo "Signing status recorded by the build: $SIGNING_STATUS"

      # Regression gate for the "no secret material in the APK" security fix:
      # .env entries and known provider API-key patterns must be absent.
      # Only counts are printed - secret values are never echoed.
      - name: Verify no secret material is bundled in the APK        env:
          ARTIFACT_PATH: ${{ env.ARTIFACT_PATH }}
        run: |
          echo "── Bundled .env check ──"
          ENV_HITS=$(unzip -l "$ARTIFACT_PATH" | grep -acE "flutter_assets/\.env|^.*[[:space:]]\.env[[:space:]]*$" || true)
          echo ".env entries found in APK: $ENV_HITS"
          if [ "$ENV_HITS" -ne 0 ]; then
            echo "::error::.env is bundled inside the APK; release builds must not ship it"
            exit 1
          fi
          echo "OK: no .env entry in the APK"

          echo "── Known secret-pattern scan over every APK entry ──"
          # Provider keys must never be bundled. Each family is counted
          # separately so a failure names the offender instead of collapsing
          # into one number.
          #
          # Google/Gemini keys use the AIza prefix, which is also the Firebase
          # client key's prefix. lib/firebase_options.dart is compiled into the
          # APK on purpose: that key is a public project identifier, not a
          # credential, and every shipped Firebase app contains it. So AIza hits
          # are counted, then this repository's own public Firebase client key is
          # accounted for. Anything else matching AIza is still fatal, and the
          # other three families are untouched.
          #
          # The exemption is derived, not hardcoded: it reads the key from the
          # tracked options file. Replacing that file with a different Firebase
          # project changes the exempt value automatically, and a missing file
          # breaks the build rather than silently passing.
          if ! APK_CONTENT=$(unzip -p "$ARTIFACT_PATH" "*" 2>/dev/null); then
            echo "::error::Could not read APK entries with unzip; refusing to report a clean scan on unreadable content"
            exit 1
          fi
          if [ -z "$APK_CONTENT" ]; then
            echo "::error::APK produced no extractable content; refusing to report a clean scan"
            exit 1
          fi

          FIREBASE_KEY=$(sed -n "s/.*apiKey: *'\(AIza[0-9A-Za-z_-]*\)'.*/\1/p" lib/firebase_options.dart | head -n1)
          if [ -z "$FIREBASE_KEY" ]; then
            echo "::error::Could not read the public Firebase client key from lib/firebase_options.dart; refusing to skip the AIza check"
            exit 1
          fi

          count() {
            # $1 = extended regex. Counts OCCURRENCES, not lines: APK content is
            # largely binary, so two keys on one line must not collapse to one
            # match and let an extra key slip past the comparison below.
            printf '%s' "$APK_CONTENT" | grep -aoE "$1" | wc -l | tr -d ' '
          }

          GEMINI_HITS=$(count "AIza[0-9A-Za-z_-]{35}")
          FIREBASE_PRESENT=$(printf '%s' "$APK_CONTENT" | grep -aoF "$FIREBASE_KEY" | wc -l | tr -d ' ')
          GROQ_HITS=$(count "gsk_[0-9A-Za-z]{40,}")
          CEREBRAS_HITS=$(count "csk-[0-9A-Za-z]{40,}")
          OPENROUTER_HITS=$(count "sk-or-[0-9A-Za-z-]{20,}")

          echo "Firebase client key (public, expected): $FIREBASE_PRESENT occurrence(s)"
          echo "Gemini-pattern lines:        $GEMINI_HITS"
          echo "Groq-pattern lines:          $GROQ_HITS"
          echo "Cerebras-pattern lines:      $CEREBRAS_HITS"
          echo "OpenRouter-pattern lines:    $OPENROUTER_HITS"

          if [ "$GROQ_HITS" -ne 0 ] || [ "$CEREBRAS_HITS" -ne 0 ] || [ "$OPENROUTER_HITS" -ne 0 ]; then
            echo "::error::Bundled APK content matches a provider API-key pattern"
            exit 1
          fi
          if [ "$GEMINI_HITS" -gt 0 ] && [ "$FIREBASE_PRESENT" -eq 0 ]; then
            echo "::error::Bundled APK content matches the AIza pattern but is not the tracked public Firebase client key"
            exit 1
          fi
          if [ "$GEMINI_HITS" -gt "$FIREBASE_PRESENT" ]; then
            echo "::error::Bundled APK content has more AIza-pattern matches ($GEMINI_HITS) than occurrences of the public Firebase client key ($FIREBASE_PRESENT); assume a real Gemini key is bundled"
            exit 1
          fi
          echo "OK: the only AIza match is the public Firebase client key; no provider key patterns found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: |
            build/app/outputs/logs/**
            android/build/reports/**
          if-no-files-found: ignore
