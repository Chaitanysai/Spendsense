name: Flutter Test Only

# This workflow performs static validation and tests; it never builds an APK,
# signs, uploads artifacts, deploys, or touches Firebase. Pull requests run only
# when workflow or Flutter source/test paths in this validation scope change.
on:
  pull_request:
    paths:
      - '.github/workflows/flutter-test-only.yml'
      - '.github/actions/flutter-setup/**'
      - 'lib/main.dart'
      - 'lib/firebase_options.dart'
      - 'lib/services/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

# Least privilege: the job reads the repository and nothing else. No secrets
# are referenced anywhere in this file, and no write scopes are requested, so
# a compromised run cannot push, publish, or mutate repository state.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    # Pinned, not ubuntu-latest: GitHub migrated ubuntu-latest to a newer image
    # in Oct 2026 and this repository has not validated its Flutter toolchain
    # there. Linux is the cheapest host that runs headless widget tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # Same SHA-pinned commit as android-release.yml (v4). This repository
        # enforces sha_pinning_required, so tag refs are rejected at job setup.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record checked-out commit
        # Evidence for the report: the dispatched ref can move between the event
        # firing and checkout, so print both SHAs rather than assuming equality.
        run: |
          echo "Event SHA:   ${GITHUB_SHA}"
          echo "Checked out: $(git rev-parse HEAD)"
          echo "Ref:         ${GITHUB_REF}"
          {
            echo "### Commit under test"
            echo '```'
            echo "event:      ${GITHUB_SHA}"
            echo "git HEAD:   $(git rev-parse HEAD)"
            echo "ref:        ${GITHUB_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Flutter
        # Local copy of subosito/flutter-action v2 (upstream's actions/cache
        # steps are rejected by this repository's sha_pinning_required policy,
        # so upstream cannot be used directly). 3.47.8 is the SDK this branch's
        # pubspec.lock was resolved with; note the lock only requires Flutter
        # >=3.38.4, so this pin is stricter than the constraint.
        uses: ./.github/actions/flutter-setup
        with:
          channel: 'stable'
          flutter-version: '3.47.8'

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify pubspec.lock was not rewritten
        # A different resolution would mean the tests ran against a dependency
        # graph other than the committed one. Fail instead of accepting drift.
        run: git diff --exit-code -- pubspec.lock

      - name: Verify Dart formatting of the change set (read-only)
        # --output=none never writes files; --set-exit-if-changed makes any
        # misformatted file a failure instead of silently rewriting source.
        # Scope is the App Check change set on purpose: a repo-wide
        # `dart format lib test` already reports 37 unrelated baseline files
        # under Flutter 3.47.8's formatter, which would make this gate fail for
        # reasons unrelated to the change under test. Widen to `lib test` once
        # the baseline has been reformatted in a dedicated change.
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/main.dart \
            lib/services/app_check \
            lib/services/assistant/assistant_auth.dart \
            test/app_check

      - name: Static analysis
        run: flutter analyze

      - name: App Check bootstrap tests
        run: flutter test test/app_check/app_check_bootstrap_test.dart

      - name: App Check token provider tests
        run: flutter test test/app_check/firebase_app_check_token_provider_test.dart

      - name: Full test suite
        run: flutter test
